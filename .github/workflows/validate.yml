name: Validate bootstrap

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n bootstrap.sh
          bash -n env
      - name: ORA8 regression checks
        run: python3 -m unittest discover -s tests -p 'test_ora8_network_guard.py'
      - name: Validate documented template and scan for credentials
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          env_path = Path("env")
          readme = Path("README.md").read_text()
          script = Path("bootstrap.sh").read_text(errors="ignore")
          rows = {}
          for line_no, line in enumerate(env_path.read_text().splitlines(), 1):
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              match = re.match(r"^\s*(?:export\s+)?([A-Z][A-Z0-9_]*)=(.*)$", line)
              if not match:
                  raise SystemExit(f"env:{line_no}: unsupported or malformed assignment")
              key, value = match.groups()
              if key in rows:
                  raise SystemExit(f"env:{line_no}: duplicate variable {key}")
              rows[key] = value.strip().strip("'").strip('"')
              if f"`{key}`" not in readme:
                  raise SystemExit(f"README.md does not document {key}")

          secret_name = re.compile(r"(PASSWORD|TOKEN|API_KEY|AUTH_KEY|SECRET|PAT)$", re.I)
          for key, value in rows.items():
              if secret_name.search(key) and value and not (
                  "CHANGE_ME" in value or "REPLACE_ME" in value or
                  value.startswith("YOUR_") or value.startswith("<")
              ):
                  raise SystemExit(f"env contains a non-placeholder value for secret variable {key}")

          patterns = {
              "OpenAI-style key": r"\bsk-[A-Za-z0-9_-]{20,}\b",
              "Google API key": r"\bAIza[A-Za-z0-9_-]{20,}\b",
              "AQ-style API key": r"\bAQ\.[A-Za-z0-9_-]{20,}\b",
              "GitHub token": r"\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b",
              "Tailscale auth key": r"\btskey-[A-Za-z0-9_-]{20,}\b",
              "Firecrawl key": r"\bfc-[A-Za-z0-9_-]{20,}\b",
          }
          for label, pattern in patterns.items():
              if re.search(pattern, script) or re.search(pattern, env_path.read_text()):
                  raise SystemExit(f"Potential hard-coded {label} detected")

          print(f"Validated {len(rows)} documented environment variables; no known credential patterns found.")
          PY
